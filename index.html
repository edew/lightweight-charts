<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Debug page</title>
	<style>
		/* dense, in the style of a market data terminal: no rounded corners, no free space */
		body {
			/* the space around the cards is where the pointer can scroll the page: a chart takes the wheel */
			margin: 0;
			padding: 16px;
			background: #0b0b0c;
			color: #d1d4dc;
			font: 11px/1.2 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
		}

		header {
			display: flex;
			gap: 8px;
			margin-bottom: 12px;
			color: #8a8a8a;
		}

		h1 {
			color: #fff;
		}

		h1,
		h2 {
			margin: 0;
			font: inherit;
			font-weight: bold;
			text-transform: uppercase;
		}

		#cards {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
			gap: 14px;
		}

		.card {
			min-width: 0;
			border: 1px solid #3a3a3a;
			background: #000;
		}

		.head {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 0 6px;
			padding: 1px 4px;
			border-bottom: 1px solid #3a3a3a;
			background: #141414;
		}

		.tabs {
			display: flex;
			flex-wrap: wrap;
		}

		.tabs button,
		.chart button {
			padding: 1px 4px;
			border: 0;
			background: none;
			color: #8a8a8a;
			font: inherit;
			cursor: pointer;
		}

		.tabs button:hover {
			color: #fff;
		}

		.tabs button.active,
		.chart button {
			background: #1e4fa8;
			color: #fff;
		}

		.chart {
			position: relative;
			height: 200px;
			overflow: hidden;
		}

		/* an element that the page puts above a chart */
		.chart .over {
			position: absolute;
			z-index: 2;
		}

		.legend,
		.note {
			top: 2px;
			left: 4px;
			color: #8a8a8a;
			pointer-events: none;
		}

		.legend b {
			display: block;
			color: #fff;
			font-size: 14px;
		}

		.tooltip {
			display: none;
			width: 84px;
			padding: 2px 4px;
			border: 1px solid #8a8a8a;
			background: #000;
			color: #8a8a8a;
			pointer-events: none;
		}

		.tooltip b {
			display: block;
			color: #fff;
		}
	</style>
	<script type="module" src="./dev/main.js"></script>
</head>

<body>
	<header>
		<h1>Debug page</h1>
		<span id="version"></span>
	</header>
	<div id="cards"></div>
</body>

</html>
